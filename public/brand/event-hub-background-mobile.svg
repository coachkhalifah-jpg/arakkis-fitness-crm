<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-label="Abstract warm green and coral background">
  <defs>
    <linearGradient id="wash" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f7f8f5"/>
      <stop offset=".5" stop-color="#dceee8"/>
      <stop offset="1" stop-color="#f4d9c9"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="55"/></filter>
  </defs>
  <rect width="900" height="1200" fill="url(#wash)"/>
  <circle cx="80" cy="160" r="180" fill="#8fc8b5" opacity=".4" filter="url(#blur)"/>
  <circle cx="820" cy="1040" r="240" fill="#efaa8e" opacity=".45" filter="url(#blur)"/>
</svg>
