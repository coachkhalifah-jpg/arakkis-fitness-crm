name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format-check
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build

      # Playwright is intentionally local-only in Phase 0: CI has no need for
      # browser binaries or external services while the app has no data workflows.
